<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function func1(){
            document.getElementById("para").style.color="red";
        
        }
        function func2(){
             document.getElementById("para").style.color="blue";
        }
        function modifyText(){
            const namefield=document.getElementById("name");
            namefield.value=namefield.value.toUpperCase();
        }
    </script>
    <p id ="para">WELCOME TO UNIVERSITY</p>
    <h2 onmouseout="func1()">Onmouse out event example</h2>
    <h2 onmouseover="func2()">Onmouse out event example</h2>
    <input type="text" id="name" oninput=modifyText()>
</body>
</html>
