<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    <link rel="stylesheet" href="employee.css">
</head>
<body>

<div class="layout">

    <aside class="sidebar">
        <h2>👥 Employee System</h2>
        <button class="nav active" data-view="dashboard">⌂ Dashboard</button>
        <button class="nav" data-view="form">＋ Add Employee</button>
        <button class="nav" data-view="dashboard">♟ Employees</button>
        <button class="nav" data-view="search">⌕ Search Employee</button>
    </aside>

    <main>
        <header>
            <h1 id="pageTitle">Employee List</h1>
            <button class="primary" id="addButton">+ Add Employee</button>
        </header>

        <p id="status">Connecting to API...</p>

        <!-- EMPLOYEE DASHBOARD -->
        <section id="dashboard" class="view">
            <div class="stats">
                <div class="card">
                    <p>Total Employees</p>
                    <h2 id="total">0</h2>
                </div>
                <div class="card">
                    <p>Departments</p>
                    <h2 id="departments">0</h2>
                </div>
                <div class="card">
                    <p>Average Salary</p>
                    <h2 id="average">₹0</h2>
                </div>
            </div>

            <div class="panel">
                <h2>Employee List</h2>

                <input type="search" id="filter"
                       placeholder="Search employees...">

                <button id="refresh">Refresh</button>

                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Department</th>
                                <th>Salary</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="rows">
                            <tr>
                                <td colspan="6">Loading employees...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- ADD / UPDATE EMPLOYEE FORM -->
        <section id="form" class="view hidden">
            <div class="panel">
                <h2 id="formTitle">Add New Employee</h2>

                <form id="employeeForm">
                    <input type="hidden" id="id">

                    <div class="form-grid">
                        <div>
                            <label for="name">Employee Name *</label>
                            <input type="text" id="name"
                                   required placeholder="Enter employee name">
                        </div>

                        <div>
                            <label for="phone">Phone Number</label>
                            <input type="tel" id="phone"
                                   placeholder="Enter phone number">
                        </div>

                        <div>
                            <label for="email">Email *</label>
                            <input type="email" id="email"
                                   required placeholder="Enter email address">
                        </div>

                        <div>
                            <label for="salary">Salary *</label>
                            <input type="number" id="salary"
                                   min="0" required placeholder="Enter salary">
                        </div>

                        <div>
                            <label for="department">Department *</label>
                            <select id="department" required>
                                <option value="">Select department</option>
                                <option>IT</option>
                                <option>HR</option>
                                <option>Finance</option>
                                <option>Marketing</option>
                                <option>Operations</option>
                                <option>Sales</option>
                                <option>Administration</option>
                            </select>
                        </div>

                        <div>
                            <label for="joiningDate">Joining Date</label>
                            <input type="date" id="joiningDate">
                        </div>
                    </div>

                    <div class="actions">
                        <button type="submit" class="primary" id="saveButton">
                            Save Employee
                        </button>
                        <button type="button" id="resetButton">Reset</button>
                        <button type="button" id="cancelButton">Cancel</button>
                    </div>
                </form>
            </div>
        </section>

        <!-- SEARCH EMPLOYEE -->
        <section id="search" class="view hidden">
            <div class="panel">
                <h2>Search Employee</h2>

                <form id="searchForm">
                    <input type="search" id="query"
                           placeholder="Enter ID, name or email">
                    <button type="submit" class="primary">Search</button>
                </form>

                <div id="results"></div>
            </div>
        </section>

    </main>
</div>

<script src="employee.js"></script>
</body>
</html>
