<!DOCTYPE html>
<html>
<head>
    <title>Minimum Value in Array</title>
</head>
<body>
<h2>Find Minimum Value in Array</h2>
<p id="result"></p>
<script>
    let arr = [12, 7 , 2007, 23, 6,2004];
    let min = arr[0];
    for (let i = 1; i < arr.length; i++) {
        if (arr[i] < min) {
            min = arr[i];
        }
    }
    document.getElementById("result").innerHTML =
        "Minimum value is: " + min;
</script>
</body>
</html>
