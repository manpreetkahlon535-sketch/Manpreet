<!DOCTYPE html>
<html>
<body>
<h1>JavaScript if</h1>

<p>display the number whether it is even or odd!!!</p>

<p id="demo">numbers</p>

<script>
  let num=20;
if (num%2==0) {
  document.getElementById("demo").innerHTML = "even";
}
else{
  document.getElementById("demo").innerHTML = "odd";
}
</script>

</body>
</html>
