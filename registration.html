<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>

    <style>
        body {
            background-color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px 10px;
        }

        .form-box {
            width: 700px;
            max-width: 95%;
            margin: 0 auto;
            padding: 25px;
            border: 2px solid black;
            border-radius: 10px;
            box-sizing: border-box;
            background-color: white;
        }

        .logo {
            display: block;
            width: 100px;
            height: 100px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        td {
            padding: 10px;
        }

        input[type="text"],
        input[type="password"] {
            max-width: 100%;
            box-sizing: border-box;
        }

        textarea {
            max-width: 100%;
            box-sizing: border-box;
        }

        .buttons {
            text-align: center;
        }

        @media (max-width: 600px) {
            .form-box {
                padding: 10px;
            }

            td {
                padding: 6px;
            }
        }
    </style>
</head>

<body>

<div class="form-box" align="center">

   <img src="C:\Users\HP\OneDrive\Pictures\Camera Roll\ltsu.jpeg"
                     alt="LTSU Logo"
                     width="100"
                     height="100"
align="center">

    <h1>Student Registration Form</h1>
    <hr>

    <form>
        <table>
            <tr>
                <td>Roll no. :</td>
                <td><input type="text" name="rollno" size="40"></td>
            </tr>

            <tr>
                <td>Student name :</td>
                <td>
                    <input type="text" size="16" placeholder="First Name">
                    -
                    <input type="text" size="16" placeholder="Last Name">
                </td>
            </tr>

            <tr>
                <td>Father's name :</td>
                <td><input type="text" size="40"></td>
            </tr>

            <tr>
                <td>Date of birth :</td>
                <td>
                    <input type="text" size="3" placeholder="Day">
                    -
                    <input type="text" size="3" placeholder="Month">
                    -
                    <input type="text" size="6" placeholder="Year">
                    <i>(DD-MM-YYYY)</i>
                </td>
            </tr>

            <tr>
                <td>Mobile no. :</td>
                <td>
                    <input type="text" size="3" value="+91" readonly>
                    -
                    <input type="text" size="30" placeholder="Mobile Number">
                </td>
            </tr>

            <tr>
                <td>Email id :</td>
                <td><input type="text" size="40" placeholder="Enter Email"></td>
            </tr>

            <tr>
                <td>Password :</td>
                <td><input type="password" size="40"></td>
            </tr>

            <tr>
                <td>Gender :</td>
                <td>
                    <input type="radio" name="gender"> Male
                    <input type="radio" name="gender"> Female
                </td>
            </tr>

            <tr>
                <td>Department :</td>
                <td>
                    <input type="checkbox"> CSE
                    <input type="checkbox"> IT
                    <input type="checkbox"> ECE
                    <input type="checkbox"> Civil
                    <input type="checkbox"> Mech
                </td>
            </tr>

            <tr>
                <td>Course :</td>
                <td>
                    <select name="course">
                        <option value="">Select Current Course</option>
                        <option>Python</option>
                        <option>Node</option>
                        <option>Java</option>
                        <option>React</option>
                        <option>PHP</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Student photo :</td>
                <td><input type="file" accept="image/*"></td>
            </tr>

            <tr>
                <td>City :</td>
                <td><input type="text" size="40"></td>
            </tr>

            <tr>
                <td>Address :</td>
                <td><textarea cols="36" rows="5"></textarea></td>
            </tr>

            <tr>
                <td colspan="2" class="buttons">
                    <input type="submit" value="Register">
                    <input type="reset" value="Reset">
                </td>
            </tr>
        </table>
    </form>

</div>

</body>
</html>
