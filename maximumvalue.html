<!DOCTYPE html>
<html>
<head>
    <title>Minimum and Maximum Value</title>
</head>
<body>

<h2>Find Minimum and Maximum Value in Array</h2>

<p id="result"></p>

<script>
    let arr = [10, 5, 20, 3, 15];
    let max = arr[0];

    for (let i = 1; i < arr.length; i++) {
        if (arr[i] > max) {
            max = arr[i];
        }
    }
    document.getElementById("result").innerHTML =
        "Maximum value is: " + max;
</script>

</body>
</html>
