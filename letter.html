<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Control Flow</h1>
<h2>The switch Statement</h2>

<p id="demo"></p>

<script>
let ch='t';
 
switch (ch) {
  case 'a':
    ch = "vowel";
    break;
  case 'e':
    ch = "vowel";
    break;
  case 'i':
    ch = "vowel";
    break;
  case 'o':
   ch = "vowel";
    break;
  case 'u':
   ch = "vowel";
    break;
  default :
  ch = "consonant";
    
}

document.getElementById("demo").innerHTML = "letter is " + ch;
</script>

</body>
</html>
