<!DOCTYPE html>
<html>
<head>
    <title>Even Numbers in Array</title>
</head>
<body>
<h2>Even Numbers from Array</h2>
<p id="result"></p>
<script>
    let arr = [10, 5, 20, 3, 15, 8, 12];
    let even = [];
    for (let i = 0; i < arr.length; i++) {
        if (arr[i] % 2 == 0) {
            even.push(arr[i]);
        }
    }
    document.getElementById("result").innerHTML =
        "Even numbers are: " + even;
</script>
</body>
</html>
