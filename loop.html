<!DOCTYPE html>
<html>
<body>
<h1>JavaScript loop</h1>
<h2>the for loop</h2>
<p id="demo">loop</p>
<script>
  let num= 3;
let text="";
for(let i=1;i<=10;i++){
    text += num+" * "+i+" = "+(num*i)+"<br>";
}
  document.getElementById("demo").innerHTML = text;
</script>

</body>
</html>
