<!DOCTYPE html>
<html>
<body>
<h1>JavaScript if</h1>

<p>display the number whether it is even or odd!!!</p>

<p id="demo">age</p>

<script>
  let age=10;
if (age==18) {
  document.getElementById("demo").innerHTML = "teenager";
}
else if(age>18) {
  document.getElementById("demo").innerHTML = "child";
}
else{
    document.getElementById("demo").innerHTML = "adult";
}
</script>
</body>
</html>
