<!DOCTYPE html>
<html>
<body>
<h1>JavaScript if</h1>

<p>display the number whether it is positive or negative!!!</p>

<p id="demo">numbers</p>

<script>
  let num= 10;
if (num<0) {
  document.getElementById("demo").innerHTML = "negative";
}
else{
  document.getElementById("demo").innerHTML = "positive";
}
</script>

</body>
</html>
